    HostedClusterSpecPassthrough:
      additionalProperties: true
      description: HostedClusterSpecPassthrough mirrors HostedClusterSpec from upstream HyperShift
      properties:
          autoNode:
              description: autoNode specifies the configuration for automatic node provisioning and lifecycle management.
              type: object
          channel:
              description: channel is an identifier for explicitly requesting that a non-default set of updates be applied to this cluster.
              type: string
          configuration:
              $ref: '#/components/schemas/ClusterConfiguration'
          etcd:
              description: etcd specifies configuration for the control plane etcd cluster. The
              type: object
              x-kubernetes-validations:
                  - message: Only managed configuration must be set when managementType is Managed
                    rule: 'self.managementType == ''Managed'' ? has(self.managed) : !has(self.managed)'
                  - message: Only unmanaged configuration must be set when managementType is Unmanaged
                    rule: 'self.managementType == ''Unmanaged'' ? has(self.unmanaged) : !has(self.unmanaged)'
          fips:
              description: fips indicates whether this cluster's nodes will be running in FIPS mode.
              type: boolean
          imageContentSources:
              description: imageContentSources specifies image mirrors that can be used by cluster
              items:
                  description: |-
                      ImageContentSource specifies image mirrors that can be used by cluster nodes
                      to pull content. For cluster workloads, if a container image registry host of
                      the pullspec matches Source then one of the Mirrors are substituted as hosts
                      in the pullspec and tried in order to fetch the image.
                  properties:
                      mirrors:
                          description: mirrors are one or more repositories that may also contain the same images.
                          items:
                              maxLength: 255
                              type: string
                          maxItems: 255
                          type: array
                          x-kubernetes-list-type: set
                      source:
                          description: |-
                              source is the repository that users refer to, e.g. in image pull
                              specifications.
                          maxLength: 255
                          type: string
                  required:
                      - source
                  type: object
              maxItems: 50
              type: array
          issuerURL:
              description: issuerURL is an OIDC issuer URL which will be used as the issuer in all
              type: string
          networking:
              description: networking specifies network configuration for the hosted cluster.
              type: object
              x-kubernetes-validations:
                  - message: CIDR ranges in machineNetwork, clusterNetwork, and serviceNetwork must be unique and non-overlapping
                    rule: (!has(self.machineNetwork) && self.clusterNetwork.all(c, self.serviceNetwork.all(s, c.cidr != s.cidr)) || (has(self.machineNetwork) && (self.machineNetwork.all(m, self.clusterNetwork.all(c, m.cidr != c.cidr)) && self.machineNetwork.all(m, self.serviceNetwork.all(s, m.cidr != s.cidr)) && self.clusterNetwork.all(c, self.serviceNetwork.all(s, c.cidr != s.cidr)))))
                  - message: allocateNodeCIDRs can only be set to Enabled when networkType is 'Other'
                    rule: 'has(self.allocateNodeCIDRs) && self.allocateNodeCIDRs == ''Enabled'' ? self.networkType == ''Other'' : true'
          operatorConfiguration:
              description: operatorConfiguration specifies configuration for individual OCP operators in the cluster.
              type: object
          pausedUntil:
