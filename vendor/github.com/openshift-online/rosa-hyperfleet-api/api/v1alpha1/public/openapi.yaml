                              maxLength: 2048
                              type: string
                          storageARN:
                              description: |-
                                  storageARN is an ARN value referencing a role appropriate for the Storage Operator.
                                  The following is an example of a valid policy document:
                                  {
                                  	"Version": "2012-10-17",
                                  	"Statement": [
                                  		{
                                  			"Effect": "Allow",
                                  			"Action": [
                                  				"ec2:AttachVolume",
                                  				"ec2:CreateSnapshot",
