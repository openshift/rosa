                                       "Action": [
                                         "iam:CreateServiceLinkedRole"
                                       ],
                                       "Resource": [
                                         "arn:*:iam::*:role/aws-service-role/elasticloadbalancing.amazonaws.com/AWSServiceRoleForElasticLoadBalancing"
                                       ],
                                       "Effect": "Allow"
                                     },
                                     {
                                       "Action": [
                                         "iam:PassRole"
                                       ],
                                       "Resource": [
                                         "arn:*:iam::*:role/*-worker-role"
                                       ],
                                       "Effect": "Allow"
                                     },
                                  	  {
                                  	  	"Effect": "Allow",
