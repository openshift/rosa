    # Cluster Schemas
    ClusterSpec:
      description: |-
          ClusterSpec defines the desired state of a ROSA HCP cluster.
          metadata.Name is the human-readable cluster name; metadata.Namespace is the cluster UUID.
          The owning AWS account is stored as the label hyperfleet.io/account-id.
      properties:
          deleteProtection:
              description: DeleteProtection prevents accidental deletion when enabled.
              type: boolean
          displayName:
              description: DisplayName is a human-readable name for the cluster.
              maxLength: 256
              type: string
          expirationTimestamp:
              description: ExpirationTimestamp marks when this cluster should be automatically deleted.
              format: date-time
              type: string
