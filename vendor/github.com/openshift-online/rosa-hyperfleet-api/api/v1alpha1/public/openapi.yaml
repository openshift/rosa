                                  				"ec2:DescribeInstances",
                                  				"ec2:DescribeSnapshots",
                                  				"ec2:DescribeTags",
                                  				"ec2:DescribeVolumes",
                                  				"ec2:DescribeVolumesModifications",
                                  				"ec2:DetachVolume",
                                  				"ec2:ModifyVolume"
                                  			],
                                  			"Resource": "*"
