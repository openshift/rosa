              additionalProperties:
                  type: string
              description: Tags are customer-defined labels for organizational purposes.
              maxProperties: 100
              type: object
      required:
          - hostedCluster
      type: object
    NodePoolSpec:
      description: |-
          NodePoolSpec defines the desired state of a NodePool.
          The parent Cluster is identified by the shared metadata.Namespace (cluster UUID).
      properties:
          autoRepair:
              description: AutoRepair controls whether unhealthy nodes are automatically replaced.
              type: boolean
          displayName:
              description: DisplayName is a human-readable name for the node pool.
              maxLength: 256
              type: string
