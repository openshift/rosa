                                       ],
                                       "Effect": "Allow"
                                     }
                                   ]
                                  }
                              maxLength: 2048
                              type: string
                          networkARN:
                              description: |-
                                  networkARN is an ARN value referencing a role appropriate for the Network Operator.
                                  The following is an example of a valid policy document:
                                  {
                                  	"Version": "2012-10-17",
                                  	"Statement": [
                                  		{
                                  			"Effect": "Allow",
                                  			"Action": [
