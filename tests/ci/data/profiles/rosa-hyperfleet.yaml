# HyperFleet FVT profile for Platform API v2 (ephemeral / integration).
# Use with: TEST_PROFILE=rosa-hyperfleet-basic
# Login: rosa login --hyperfleet-url $HYPERFLEET_URL
#
# Day1 create from this profile still needs handler work (GenerateClusterCreateFlags).
profiles:
  - as: rosa-hyperfleet-basic
    version: latest
    region: "us-east-1"
    cluster:
      multi_az: true
      instance_type: "m5.xlarge"
      hcp: true
      sts: true
      byo_vpc: true
      additional_principals: false
      imdsv2: ""
      private: false
      default_ingress_private: false
      etcd_encryption: false
      autoscale: false
      kms_key: false
      networking: false
      proxy_enabled: false
      label_enabled: false
      zones: ""
      tag_enabled: false
      etcd_kms: false
      fips: false
      # Empty = no OCM OIDC config resource. HyperFleet uses issuer on describe
      # and IAM OIDC provider in AWS — not rosa create/list oidc-config.
      oidc_config: ""
      auditlog_forward: false
      admin_enabled: false
      volume_size: 75
      disable_uwm: false
      autoscaler_enabled: false
      additional_sg_number: 3
      registries_config: false
      allowed_registries: false
      log_forward: false
    account-role:
      customized_prefix: false
      path: ""
      permission_boundary: ""
