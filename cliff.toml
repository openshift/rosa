# git-cliff configuration for the ROSA CLI historical changelog.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{%- macro group(commit) -%}
{%- set body = commit.body | default(value="") -%}
{%- if commit.group is starting_with("<!--") -%}
    {{- commit.group -}}
{%- elif commit.raw_message is matching("^feat") -%}
    <!-- 1 -->FEATURES:
{%- elif commit.raw_message is matching("^(fix|docs|perf|refactor|style|chore)") -%}
    <!-- 2 -->ENHANCEMENTS:
{%- elif body is matching(".*security") -%}
    <!-- 4 -->SECURITY:
{%- elif commit.raw_message is matching("^revert") -%}
    <!-- 5 -->REVERTS:
{%- else -%}
    <!-- 2 -->ENHANCEMENTS:
{%- endif -%}
{%- endmacro group -%}
{%- macro scope(commit) -%}
{%- set body = commit.body | default(value="") -%}
{%- if commit.raw_message is matching("^chore[(]deps[)]!?:") -%}
    Dependencies
{%- elif commit.scope -%}
    {{- commit.scope -}}
{%- elif commit.raw_message is matching("^feat") -%}
    Ignore scope
{%- elif commit.raw_message is matching("^fix") -%}
    Bug fixes
{%- elif commit.raw_message is matching("^docs") -%}
    Documentation
{%- elif commit.raw_message is matching("^perf") -%}
    Performance
{%- elif commit.raw_message is matching("^(refactor|style|chore)") -%}
    Chores
{%- elif body is matching(".*security") or commit.raw_message is matching("^revert") -%}
    Ignore scope
{%- elif commit.raw_message is matching("(?i).*documentation.*") -%}
    Documentation
{%- elif commit.raw_message is matching("(?i)(^|.*[[:space:]])fix([[:space:]]|:)") -%}
    Bug fixes
{%- else -%}
    Other
{%- endif -%}
{%- endmacro scope -%}
{%- if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%d %b, %Y") }})
{%- else -%}
## [unreleased]
{%- endif -%}
{%- set breaking_commits = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking_commits %}

BREAKING CHANGES:
{% for commit in breaking_commits %}
   * {{ commit.message | upper_first | split(pat="\n") | first }}
{% if commit.breaking_description and commit.breaking_description != commit.message %}
     {{ commit.breaking_description | replace(from="\n", to="\n     ") }}
{% endif -%}
{%- endfor -%}
{%- endif -%}
{%- for group in ["<!-- 1 -->FEATURES:", "<!-- 2 -->ENHANCEMENTS:", "<!-- 4 -->SECURITY:", "<!-- 5 -->REVERTS:"] -%}
{%- set_global group_commits = [] -%}
{%- set_global scopes = [] -%}
{%- for commit in commits -%}
{%- if not commit.breaking and self::group(commit=commit) == group -%}
{%- set_global group_commits = group_commits | concat(with=commit) -%}
{%- set_global scopes = scopes | concat(with=self::scope(commit=commit)) -%}
{%- endif -%}
{%- endfor -%}
{%- if group_commits %}

{{ group | striptags | trim | upper }}
{%- for scope in scopes | unique | sort -%}
{%- set_global scope_commits = [] -%}
{%- for commit in group_commits -%}
{%- if self::scope(commit=commit) == scope -%}
{%- set_global scope_commits = scope_commits | concat(with=commit) -%}
{%- endif -%}
{%- endfor %}
{%- if not (scope is containing("Ignore")) %}
 * {{ scope | upper_first }}
   {%- for commit in scope_commits %}
   * {{ commit.message | upper_first | split(pat="\n") | first }}\
   {% endfor %}
{%- else %}
{%- for commit in scope_commits %}
   * {{ commit.message | upper_first | split(pat="\n") | first }}\n
{%- endfor -%}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endfor %}\n
"""
trim = false
render_always = false
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

commit_preprocessors = [
    { pattern = '^[A-Z]+-\d+\s*\|\s*(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9._-]+\))?(!)?:\s*(.+)$', replace = "$1$2$3: $4" },
    { pattern = '^OCM-0+\s*\|\s*(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9._-]+\))?(!)?:\s*(.+)$', replace = "$1$2$3: $4" },
    { pattern = '^[A-Z]+-\d+:\s*', replace = "" },
    { pattern = '^[A-Z]+-\d+\s*\|\s*', replace = "" },
    { pattern = 'Signed-off-by:.*>', replace = "" },
]

commit_parsers = [
    { message = "^[[:alnum:]_-]+\\((ci|test|e2e)\\)!?:", skip = true },
    { message = "(?i).*changelog.*", skip = true },
    { message = "(?i).*set release version.*", skip = true },
    { message = "(?i).*update release version.*", skip = true },
    { message = "(?i).*bump (release )?version.*", skip = true },
    { message = "(?i).*prepare cli .* for release.*", skip = true },
    { message = "(?i).*release process.*", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^\\S+$", skip = true },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^Merge remote-tracking branch", skip = true },
    { message = "Update README.md", skip = true },

    { message = "^chore\\(deps\\)!?:", group = "<!-- 2 -->ENHANCEMENTS:", scope = "Dependencies" },
    { message = "^(test|ci|build|chore)(\\([^)]*\\))?!?:", skip = true },

    { message = "^feat", group = "<!-- 1 -->FEATURES:", default_scope = "Ignore scope" },
    { message = "^fix", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Bug fixes" },
    { message = "^docs", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Documentation" },
    { message = "^perf", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Performance" },
    { message = "^refactor", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Chores" },
    { message = "^style", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Chores" },
    { message = "^chore", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Chores" },
    { body = ".*security", group = "<!-- 4 -->SECURITY:", default_scope = "Ignore scope" },
    { message = "^revert", group = "<!-- 5 -->REVERTS:", default_scope = "Ignore scope" },
    { message = "(?i).*documentation.*", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Documentation" },
    { message = "(?i)(^|.*\\s)fix(\\s|:)", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Bug fixes" },
    { message = ".*", group = "<!-- 2 -->ENHANCEMENTS:", default_scope = "Other" },
]

protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = false
link_parsers = [
    # Supported contributor ticket prefixes
    { pattern = "OCM-(\\d+)", href = "https://issues.redhat.com/browse/OCM-$1" },
    { pattern = "ROSAENG-(\\d+)", href = "https://issues.redhat.com/browse/ROSAENG-$1" },
]
use_branch_tags = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ".*([._-]rc[0-9]*|-prerelease\\.|-test|-testing|-hotfix).*"
topo_order = false
topo_order_commits = false
sort_commits = "newest"
recurse_submodules = false
