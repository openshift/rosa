# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  # Restates the dependency review section of AGENTS.md; keep them aligned.
  high_level_summary_instructions: |
    Keep the standard summary of the changes for every pull request.
    When any go.mod changes dependency versions or replacements, including
    Renovate pull requests, also add a "Dependency Impact Report" section
    generated from your own analysis; do not ask the author to provide one.
    For each changed module, state:
    - Old and new versions, or replacement targets, from the diff.
    - Upstream release notes and source comparisons inspected, including
      intermediate releases, or that this evidence was unavailable.
    - Affected usage and call paths in this repository, including code
      outside the diff.
    - Behavior changes that reach those paths, distinguishing source
      inspection from runtime verification.
    - Verification gaps and the targeted checks that would close them.
    The report informs reviewers; it does not approve, block, or enforce
    a merge.
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  poem: false
  suggested_labels: false
  path_filters:
    - "!vendor/**"
    - "!**/vendor/**"
    - "!pkg/**/mocks/**"
    - "!cmd/create/idp/mocks/**"
    - "!assets/bindata.go"
    - "!**/*.pb.go"
    - "!**/*.pb.gw.go"
    - "!**/testdata/**"
  path_instructions:
    - path: "**/go.mod"
      instructions: |
        This PR updates external dependencies (library bump).
        Perform a deep source-level analysis of the bumped packages and verify:
        
        1. **Behavioral Changes & Breaking Defaults:** Inspect if updated libraries altered default behaviors (e.g., proxy transport changes, default options, or dropped bypasses like `InsecureSkipVerify`).
        2. **Impact on Calling Code:** Identify all call sites in this repository using the updated package. Alert if internal semantics changed, even if the code compiles without errors.
        3. **Configuration & Flag Wiring:** Check whether CLI flags/options (such as `--insecure`, custom CA, or proxy settings) need to be explicitly passed into the updated library APIs to maintain expected user-facing options.
        4. **Feature Adoption & Code Refactoring:** Check if the new library version introduces features, options, or abstractions that could simplify existing workarounds or improve implementation efficiency.

        5. **Compatibility Evidence:**
           For authentication or transport changes, explicitly inspect
           rosa login, authorization-code exchange, token refresh, and
           OCM requests. Check TLS minimum versions, certificate trust,
           custom CAs, proxies, and compatibility-option propagation.

           Do not infer compatibility from compilation, passing unrelated
           tests, a patch-version bump, or release-note titles alone.
           Distinguish source inspection from runtime verification.
           If upstream evidence is unavailable, report that limitation.

        6. **Finding Severity:**
           Follow the dependency review section of AGENTS.md. Raise a blocking
           finding only for a demonstrated incompatibility, or for a concrete
           upstream behavior change that reaches an affected ROSA CLI call
           path without the targeted compatibility tests needed to verify it;
           state the failure condition and the exact checks required. Report
           incomplete evidence or relevant unresolved upstream changes as
           warnings. Treat optional improvements and new features from item 4
           as informational. Do not present a conditional risk as a confirmed
           failure.
    - path: "cmd/**/*.go"
      instructions: |
        - Treat Cobra wiring, flags, command UX, and error handling as high-signal review areas.
        - Flag changes that add commands or flags without matching updates to `cmd/rosa/structure_test/command_structure.yml` or the matching `command_args.yml`.
        - Prefer thin command files and business logic in `pkg/`.
    - path: "**/*.sh"
      instructions: |
        - Review shell scripts for portable bash usage, strict-mode safety, quoting, and robust temporary-file or pipe handling.
        - Keep script behavior aligned with `Makefile`, `hack/run-checks.sh`, and the git hooks instead of introducing parallel workflows.
    - path: "**/Dockerfile*"
      instructions: |
        - Keep build and runtime image changes aligned with the repo's Go toolchain, release flow, and static-binary expectations.
        - Flag unpinned downloads, secret-bearing build arguments, or image changes that drift from Tekton/Konflux assumptions without justification.
    - path: ".tekton/**/*.{yml,yaml}"
      instructions: |
        - Treat Konflux/Tekton pipeline steps, required scan stages, and fail-fast behavior as high-signal review areas.
        - Flag changes that bypass validation gates, artifact flow, or image/security checks without matching workflow updates.
    - path: "pkg/aws/**/*.go"
      instructions: |
        - Cross-check AWS behavior and user-facing wording against the official ROSA and AWS references in `guidelines/aws-guidelines.md`.
        - Flag hardcoded credentials, secret exposure, or assumptions about STS, IAM, OIDC, VPC, quotas, or regions that are not verified.
    - path: "pkg/**/*.go"
      instructions: |
        - Review for test coverage impact, error wrapping, reporter consistency, and alignment with nearby package patterns.
        - Flag direct edits to generated mocks or attempts to bypass existing helper flows.
    - path: "**/*_test.go"
      instructions: |
        - Use Ginkgo v2 and Gomega conventions already present in the repo.
        - Flag weak tests that only restate implementation or changes that weaken existing assertions.
    - path: "**/*.md"
      instructions: |
        - Use `AGENTS.md` to select the relevant topic guide; check commands against `CONTRIBUTING.md` and product terminology against the official ROSA/AWS docs in `guidelines/aws-guidelines.md`.
        - Flag stale file paths, placeholder Jira links, or wording that conflicts with the real repository workflow.
    - path: "cmd/rosa/structure_test/**/*.{yml,yaml}"
      instructions: |
        - Ensure command structure and flag expectations stay exactly aligned with the CLI tree and supported Cobra flags.
        - Flag command or flag changes in Go code that are not reflected here, and vice versa.
    - path: "cmd/create/network/templates/**/*.yaml"
      instructions: |
        - Review CloudFormation and network template changes against the ROSA and AWS guidance referenced from `AGENTS.md`.
        - Flag unsupported AWS assumptions, risky networking defaults, or stale CLI-version/template compatibility notes.
    - path: ".github/**/*"
      instructions: |
        - Keep issue and PR metadata aligned with repo-local agent guidance and contributor workflow.
  pre_merge_checks:
    custom_checks:
      # Restates the dependency review section of AGENTS.md; keep them aligned.
      - name: Dependency compatibility evidence
        mode: error
        instructions: |
          Apply when any go.mod changes dependency versions or replacements,
          including Renovate PRs. Otherwise, pass as not applicable.

          Assess compatibility independently from the PR diff, repository
          source, and upstream release notes and source comparisons. Do not
          require an author-supplied dependency impact report, and do not
          depend on CodeRabbit summary, walkthrough, or review output.

          This check cannot run tests; treat committed tests and linked test
          results only as evidence. For authentication or transport changes,
          inspect rosa login, authorization-code exchange, token refresh, and
          OCM request paths.

          Fail only when an upstream change is demonstrated to break an
          affected ROSA CLI call path, or when a concrete upstream behavior
          change reaches an affected ROSA CLI call path and neither targeted
          tests that verify the affected supported configurations nor an
          explicit maintainer decision accepting a documented support-policy
          change is present. State the failure condition and the exact
          targeted checks required.

          Report Inconclusive instead of failing when upstream evidence is
          unavailable or incomplete, or when it remains unresolved whether a
          relevant upstream change reaches an affected ROSA CLI call path;
          name the missing evidence. Do not accept compilation, unrelated CI,
          patch-version bumps, or release-note titles alone as compatibility
          evidence. Do not fail for optional improvements or new features.

          This check evaluates evidence; it does not execute tests or itself
          enforce repository merge protection.
  tools:
    checkov:
      enabled: false
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: false
    shellcheck:
      enabled: true
    trivy:
      enabled: false
    yamllint:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CONTRIBUTING.md
      - guidelines/**
      - .claude/SKILLS.md
      - .claude/skills/**/SKILL.md
  learnings:
    scope: local
